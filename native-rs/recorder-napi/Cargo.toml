[package]
name = "recorder-napi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "napi-rs bindings for recorder-core (Electron native addon)"

[lib]
crate-type = ["cdylib"]

[dependencies]
recorder-core = { path = "../recorder-core" }
napi = { workspace = true, features = ["napi8", "serde-json"] }
napi-derive.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
napi-build = "2"
