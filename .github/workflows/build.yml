# 在对应系统 runner 上编译原生 .node（recorder + focus-paste）并打安装包。
# - 手动 Run workflow（选 main 等分支）：打 mac 包，上传 Artifact（不发 Release）
# - 推送 v* tag：同上，并由 electron-builder 发布到 GitHub Release
name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-mac:
    name: macOS
    runs-on: macos-latest

    defaults:
      run:
        shell: bash

    env:
      # tag 发布；手动触发仅打 Artifact
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 无签名证书时跳过，避免 CI 失败（mac 自动更新仍需自行签名）
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG 与 package.json version ($PKG) 不一致"
            exit 1
          fi

      - name: Build native addons
        run: npm run build:native

      - name: Verify native binaries
        run: |
          ls -la native/
          test -n "$(ls native/recorder.darwin-*.node 2>/dev/null)"
          test -n "$(ls native/focus-paste.darwin-*.node 2>/dev/null)"

      - name: Typecheck + vite build
        run: npm run build

      - name: Package
        run: npx electron-builder --mac --publish "$PUBLISH"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: c-tools-mac-${{ github.ref_name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
