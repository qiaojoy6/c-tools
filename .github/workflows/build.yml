# 在对应系统 runner 上编译录屏 .node 并打安装包。
# - 手动 Run：只上传 Artifact
# - 推送 v* tag：打全平台并发布到 GitHub Release（供 electron-updater）
name: Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform(s) to build
        required: true
        default: all
        type: choice
        options:
          - all
          - mac
          - win
  push:
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            label: macOS
            artifact: c-tools-mac
            builder_args: --mac
          - os: windows-latest
            platform: win
            label: Windows
            artifact: c-tools-win
            builder_args: --win --x64
    # tag 推送打全平台；手动触发可按输入筛选
    if: >
      github.event_name == 'push' ||
      inputs.platform == 'all' ||
      inputs.platform == matrix.platform

    defaults:
      run:
        shell: bash

    env:
      # tag 发版才 publish；手动跑只打包
      PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 无签名证书时跳过，避免 CI 失败（mac 自动更新仍需自行签名）
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sync package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          npm version "$VER" --no-git-tag-version --allow-same-version
          echo "package.json version -> $VER"

      - name: Install npm dependencies
        run: npm ci

      - name: Build recorder native addon
        run: npm run build:native

      - name: Verify native binary
        run: |
          ls -la native/
          case "${{ matrix.platform }}" in
            mac) test -n "$(ls native/recorder.darwin-*.node 2>/dev/null)" ;;
            win) test -n "$(ls native/recorder.win32-*.node 2>/dev/null)" ;;
          esac

      - name: Typecheck + vite build
        run: npm run build

      - name: Package (and publish on tag)
        run: npx electron-builder ${{ matrix.builder_args }} --publish "$PUBLISH"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.ref_name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*-setup.exe
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
