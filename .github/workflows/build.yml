# 在对应系统 runner 上编译原生 .node（recorder + focus-paste）并打安装包。
# - 仅推送 main：先 mac 再 win，上传 Artifact
name: Build

on:
  push:
    branches:
      - main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-mac:
    name: macOS
    runs-on: macos-latest

    defaults:
      run:
        shell: bash

    env:
      PUBLISH: never
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 无签名证书时跳过，避免 CI 失败（mac 自动更新仍需自行签名）
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build native addons
        run: npm run build:native

      - name: Verify native binaries
        run: |
          ls -la native/
          test -n "$(ls native/recorder.darwin-*.node 2>/dev/null)"
          test -n "$(ls native/focus-paste.darwin-*.node 2>/dev/null)"

      - name: Typecheck + vite build
        run: npm run build

      - name: Package
        run: npx electron-builder --mac --publish "$PUBLISH"

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: c-tools-mac-${{ github.ref_name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14

  build-win:
    name: Windows
    needs: build-mac
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    env:
      PUBLISH: never
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build native addons
        run: npm run build:native

      - name: Verify native binaries
        run: |
          ls -la native/
          test -n "$(ls native/recorder.win32-*.node 2>/dev/null)"
          test -n "$(ls native/focus-paste.win32-*.node 2>/dev/null)"

      - name: Typecheck + vite build
        run: npm run build

      - name: Package
        run: npx electron-builder --win --x64 --publish "$PUBLISH"

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: c-tools-win-${{ github.ref_name }}
          path: |
            dist/*-setup.exe
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
