appId: com.ctools.app
productName: c-tools
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!devtools/**'
  - '!docs/**'
  - '!plugins/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.*.tsbuildinfo,components.json}'
  # 原图仅本地备份，不打进安装包
  - '!resources/原图.png'
  - '!native-rs/**'
  - '!native/**'
  - '!target/**'
  - '!Cargo.toml'
  - '!Cargo.lock'
  - '!rust-toolchain.toml'
  - '!scripts/**'
  # 二进制走 extraResources，避免 ~45MB ffmpeg 再进 asar
  - '!node_modules/ffmpeg-static/**'
  - '!node_modules/@derhuerst/**'
  # 渲染/构建依赖已由 Vite 打进 out/，不进 asar（即便误留在 dependencies）
  - '!node_modules/@codemirror/**'
  - '!node_modules/@lezer/**'
  - '!node_modules/style-mod/**'
  - '!node_modules/w3c-keyname/**'
  - '!node_modules/crelt/**'
  - '!node_modules/lucide-vue-next/**'
  - '!node_modules/reka-ui/**'
  - '!node_modules/tailwindcss/**'
  - '!node_modules/@tailwindcss/**'
  - '!node_modules/tw-animate-css/**'
  - '!node_modules/lightningcss*/**'
  - '!node_modules/@tanstack/**'
  - '!node_modules/@vueuse/**'
  - '!node_modules/pinia/**'
  - '!node_modules/vue-router/**'
  - '!node_modules/vue/**'
  - '!node_modules/clsx/**'
  - '!node_modules/class-variance-authority/**'
  - '!node_modules/tailwind-merge/**'
  - '!node_modules/@types/**'
  - '!**/*.{map,flow,tsbuildinfo}'
  - '!**/README.md'
  - '!**/readme.md'
  - '!**/CHANGELOG.md'
  - '!**/license.md'
  - '!**/LICENSE.md'
asarUnpack:
  - resources/**
  - node_modules/koffi/**
  - node_modules/@koromix/**
extraResources:
  - from: native
    to: native
    filter:
      - '*.node'
  # 只拷可执行文件（+许可证），不拷整个 npm 包
  - from: node_modules/ffmpeg-static
    to: bin
    filter:
      - ffmpeg
      - ffmpeg.exe
      - ffmpeg.LICENSE
win:
  executableName: c-tools
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  # dmg 给人装；zip 给 electron-updater 自动更新
  target:
    - dmg
    - zip
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    - NSMicrophoneUsageDescription: c-tools 需要使用麦克风以便在录屏时采集人声。
    - NSAudioCaptureUsageDescription: c-tools 需要采集系统声音以便录屏时收录电脑播放的音频。
    - NSCameraUsageDescription: c-tools 可能需要使用摄像头（预留）。
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: qiaoyue <1807280487@qq.com>
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# 更新源：GitHub Releases（electron-updater 走 GitHub API 取最新版）
# 仓库建议公开；私有仓客户端无法匿名检查更新
publish:
  provider: github
  owner: qiaojoy6
  repo: c-tools
  # CI 推送 v* tag 时直接发布（非 draft），供 electron-updater 拉取
  releaseType: release
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
